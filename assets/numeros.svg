<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Números dos projetos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Números dos projetos</title>
  <defs></defs>
<rect x="0.5" y="0.5" width="1199" height="119" rx="20" fill="#050505" stroke="#1E1E1E"/>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.00;1" dur="0.60s" fill="freeze"/>
  <text x="150" y="64" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="34" font-weight="300" fill="#F25A0C">70</text>
  <text x="150" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#9A9A9A">testes automatizados</text></g><rect x="300" y="28" width="1" height="64" fill="#1E1E1E"/>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.20;1" dur="0.75s" fill="freeze"/>
  <text x="450" y="64" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="34" font-weight="300" fill="#F25A0C">6</text>
  <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#9A9A9A">pipelines de CI</text></g><rect x="600" y="28" width="1" height="64" fill="#1E1E1E"/>
  <g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.33;1" dur="0.90s" fill="freeze"/>
  <text x="750" y="64" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="34" font-weight="300" fill="#F25A0C">0,16 ms</text>
