  <g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.43;1" dur="1.05s" fill="freeze"/>
  <text x="1050" y="64" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="34" font-weight="300" fill="#F25A0C">14/14</text>
  <text x="1050" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#9A9A9A">tabelas com isolamento medido</text></g>
