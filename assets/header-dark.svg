<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Kaio Nacamura, Sistemas de Informação" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kaio Nacamura</title>
  <defs>
    <linearGradient id="grad-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#2F81F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
    <filter id="blur-dark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="card-dark"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card-dark)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <circle cx="980" cy="60" r="150" fill="#7C3AED" opacity="0.35" filter="url(#blur-dark)">
      <animate attributeName="cx" values="980;1060;980" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="280" r="130" fill="#06B6D4" opacity="0.35" filter="url(#blur-dark)">
      <animate attributeName="cy" values="280;220;280" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="320" fill="url(#dots-dark)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#30363D"/>

  <!-- barra de janela -->
  <circle cx="34" cy="30" r="6" fill="#FF5F57"/>
  <circle cx="54" cy="30" r="6" fill="#FEBC2E"/>
  <circle cx="74" cy="30" r="6" fill="#28C840"/>
  <text x="600" y="35" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#8B949E">kaio@nacamura: ~</text>

  <!-- nome -->
  <text x="60" y="138" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="url(#grad-dark)" letter-spacing="-1">Kaio Nacamura</text>
  <text x="62" y="182" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#8B949E">Sistemas de Informação no Mackenzie  ·  software, dados e prompts</text>

  <!-- prompt que digita -->
  <text x="60" y="252" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" font-weight="700" fill="#2F81F7">$</text>
    <clipPath id="clip0-dark"><rect x="92" y="226" width="439.6" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.1000;0.2062;0.2313;1.0000" values="0.0;439.6;439.6;0.0;0.0"/>
    </rect></clipPath>
    <text x="92" y="252" clip-path="url(#clip0-dark)" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" fill="#E6EDF3">back-end com Java, .NET e Node.js</text>
    <clipPath id="clip1-dark"><rect x="92" y="226" width="0.0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.2500;0.3500;0.4562;0.4813;1.0000" values="0.0;0.0;571.6;571.6;0.0;0.0"/>
    </rect></clipPath>
    <text x="92" y="252" clip-path="url(#clip1-dark)" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" fill="#E6EDF3">PostgreSQL, RLS e filas que não perdem dado</text>
    <clipPath id="clip2-dark"><rect x="92" y="226" width="0.0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.6000;0.7063;0.7312;1.0000" values="0.0;0.0;386.8;386.8;0.0;0.0"/>
    </rect></clipPath>
    <text x="92" y="252" clip-path="url(#clip2-dark)" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" fill="#E6EDF3">AWS e CI/CD no GitHub Actions</text>
    <clipPath id="clip3-dark"><rect x="92" y="226" width="0.0" height="36">
      <animate attributeName="width" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.7500;0.8500;0.9563;0.9812;1.0000" values="0.0;0.0;518.8;518.8;0.0;0.0"/>
    </rect></clipPath>
    <text x="92" y="252" clip-path="url(#clip3-dark)" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" fill="#E6EDF3">engenharia de prompt e análise de dados</text>
  <rect x="96" y="232" width="11" height="24" fill="#06B6D4">
    <animate attributeName="x" dur="16.0s" repeatCount="indefinite" keyTimes="0.0000;0.1000;0.2062;0.2313;0.2500;0.3500;0.4562;0.4813;0.5000;0.6000;0.7063;0.7312;0.7500;0.8500;0.9563;0.9812;1.0000" values="92.0;535.6;535.6;96.0;96.0;667.6;667.6;96.0;96.0;482.8;482.8;96.0;96.0;614.8;614.8;96.0;96.0"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- monograma -->
  <g transform="translate(1010 160)">
    <rect x="-82" y="-82" width="164" height="164" rx="36" fill="#161B22" stroke="#30363D"/>
    <rect x="-82" y="-82" width="164" height="164" rx="36" fill="none" stroke="url(#grad-dark)" stroke-width="4"
          stroke-dasharray="120 480" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-600" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text y="22" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#grad-dark)">KN</text>
  </g>
</svg>
